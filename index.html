<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns Dashboard - Classic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* رجوع للألوان القديمة */
        body { background-color: #f1f5f9; font-family: sans-serif; }
        .header-classic { background: #1e293b; color: white; padding: 25px; border-bottom: 5px solid #10b981; }
        .card-classic { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        table thead { background: #334155; color: white; }
    </style>
</head>
<body class="pb-10">

    <div class="header-classic mb-8">
        <div class="container mx-auto">
            <h1 class="text-2xl font-black italic tracking-widest text-center md:text-left">RETURNS MONITOR</h1>
        </div>
    </div>

    <div class="container mx-auto px-4 grid grid-cols-1 lg:grid-cols-4 gap-8">
        <div class="lg:col-span-1">
            <div class="card-classic">
                <h3 class="font-bold border-b-2 border-emerald-500 mb-4 pb-2 text-slate-700">New Entry</h3>
                <form onsubmit="handleSave(event)" class="space-y-4">
                    <input type="date" id="date" class="w-full p-2 border rounded-lg" required>
                    <input type="text" id="orderId" placeholder="Order ID" class="w-full p-2 border rounded-lg" required>
                    <input type="text" id="asin" placeholder="ASIN" class="w-full p-2 border rounded-lg uppercase" required>
                    <input type="number" step="0.01" id="price" placeholder="Price/Value" class="w-full p-2 border rounded-lg" required>
                    <select id="issue" class="w-full p-2 border rounded-lg">
                        <option>Fake item</option><option>Empty box</option><option>Switch item</option><option>Broken</option><option>Other</option>
                    </select>
                    <select id="road" class="w-full p-2 border rounded-lg font-bold text-emerald-600">
                        <option>RTN</option><option>RTO</option>
                    </select>
                    <button type="submit" id="saveBtn" class="w-full bg-emerald-600 text-white p-4 rounded-xl font-bold shadow-lg hover:bg-emerald-700 transition-all uppercase">Save Transaction</button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-3 space-y-6">
            <div class="grid grid-cols-3 gap-4 text-center">
                <div class="card-classic bg-emerald-50 border-b-4 border-emerald-500"><p class="text-[10px] font-bold text-emerald-600 uppercase">Total Savings</p><p id="tSavings" class="text-2xl font-black">0</p></div>
                <div class="card-classic bg-blue-50 border-b-4 border-blue-500"><p class="text-[10px] font-bold text-blue-600 uppercase">Total Items</p><p id="tItems" class="text-2xl font-black">0</p></div>
                <div class="card-classic bg-amber-50 border-b-4 border-amber-500"><p class="text-[10px] font-bold text-amber-600 uppercase">Sync Status</p><p id="syncStatus" class="text-xs font-bold mt-2">Ready</p></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card-classic"><h4 class="text-center text-xs font-bold mb-4 uppercase text-slate-400">Issues Distribution</h4><canvas id="issChart"></canvas></div>
                <div class="card-classic"><h4 class="text-center text-xs font-bold mb-4 uppercase text-slate-400">Return Road</h4><canvas id="rodChart"></canvas></div>
            </div>

            <div class="card-classic p-0 overflow-hidden shadow-xl">
                <table class="w-full text-sm">
                    <thead><tr><th class="p-4 text-left">Date</th><th class="p-4 text-left">Order / ASIN</th><th class="p-4 text-right">Value</th><th class="p-4 text-center">X</th></tr></thead>
                    <tbody id="tableBody" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- حط رابط جوجل شيت هنا ---
        const GOOGLE_SHEET_URL = "https://script.google.com/macros/s/AKfycbwqkCTgox5u1cQ3xWErHYE-04sqwraWP8o411mlfoG3WPZPN08sNwJJmUtKAjpq_P_NUA/exec"; 
        // ---------------------------

        let dataStore = JSON.parse(localStorage.getItem('my_final_v10') || "[]");
        let charts = {};

        async function handleSave(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const record = { id: Date.now(), date: document.getElementById('date').value, orderId: document.getElementById('orderId').value, asin: document.getElementById('asin').value.toUpperCase(), price: parseFloat(document.getElementById('price').value), issue: document.getElementById('issue').value, road: document.getElementById('road').value };
            
            dataStore.push(record);
            localStorage.setItem('my_final_v10', JSON.stringify(dataStore));
            render();
            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();

            if(GOOGLE_SHEET_URL.startsWith("http")) {
                btn.innerText = "Syncing...";
                try {
                    await fetch(GOOGLE_SHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(record) });
                    document.getElementById('syncStatus').innerText = "Synced ✅";
                } catch(err) { console.log(err); }
                btn.innerText = "Save Transaction";
            }
        }

        function render() {
            const body = document.getElementById('tableBody'); body.innerHTML = '';
            let total = 0;
            dataStore.slice().reverse().forEach(d => {
                total += d.price;
                body.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-4 text-xs text-slate-400">${d.date}</td><td class="p-4 font-bold text-slate-700">${d.orderId}<br><span class="text-blue-500 text-[10px] font-bold">${d.asin}</span></td><td class="p-4 text-right font-black text-emerald-600">+${d.price}</td><td class="p-4 text-center"><button onclick="del(${d.id})" class="text-red-300 hover:text-red-600">✕</button></td></tr>`;
            });
            document.getElementById('tSavings').innerText = total.toLocaleString();
            document.getElementById('tItems').innerText = dataStore.length;
            draw();
        }

        function draw() {
            const iss = {}; const rods = {RTN:0, RTO:0};
            dataStore.forEach(d => { iss[d.issue] = (iss[d.issue]||0)+1; rods[d.road]++; });
            if(charts.i) charts.i.destroy();
            charts.i = new Chart(document.getElementById('issChart'), { type: 'doughnut', data: { labels: Object.keys(iss), datasets: [{ data: Object.values(iss), backgroundColor: ['#10b981','#3b82f6','#f59e0b','#ef4444'] }] } });
            if(charts.r) charts.r.destroy();
            charts.r = new Chart(document.getElementById('rodChart'), { type: 'pie', data: { labels: ['RTN','RTO'], datasets: [{ data: [roads.RTN, roads.RTO], backgroundColor: ['#10b981','#f43f5e'] }] } });
        }

        function del(id) {
            if(confirm('Delete?')) {
                dataStore = dataStore.filter(d => d.id !== id);
                localStorage.setItem('my_final_v10', JSON.stringify(dataStore));
                render();
            }
        }

        document.getElementById('date').valueAsDate = new Date();
        render(); // تشغيل عند الفتح
    </script>
</body>
</html>
