<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns & Savings - Complete Analysis</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; 
            background-color: #f8fafc; 
            background-image: 
                radial-gradient(at 0% 0%, hsla(160, 40%, 10%, 1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(210, 40%, 30%, 1) 0, transparent 50%);
            background-repeat: no-repeat; background-size: 100% 600px;
            min-height: 100vh; color: #334155;
        }
        .card { 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            border-radius: 24px; padding: 25px; 
            box-shadow: 0 20px 40px -5px rgba(0,0,0,0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        input, select, textarea {
            background-color: #f8fafc; border: 1px solid #cbd5e1;
            border-radius: 12px; padding: 10px 14px; width: 100%;
            outline: none; transition: all 0.3s; font-size: 0.85rem;
        }
        input:focus { border-color: #10b981; background-color: white; }
        .btn-primary {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white; padding: 12px; border-radius: 12px; font-weight: 700;
            cursor: pointer; transition: all 0.3s; text-align: center; width: 100%;
        }
        .tab-btn { padding: 6px 16px; border-radius: 50px; font-weight: 600; font-size: 0.8rem; }
        .tab-active { background-color: #10b981; color: white; }
        .tab-inactive { color: #64748b; background: #f1f5f9; }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="pb-20">

    <nav class="w-full pt-6 pb-2 container mx-auto px-6 flex flex-wrap justify-between items-center gap-4 no-print">
        <div class="flex items-center gap-4 text-white">
            <div class="text-3xl">📊</div>
            <div>
                <h1 class="text-2xl font-bold">Returns Master</h1>
                <p class="text-xs opacity-80" id="syncStatus">Ready to sync</p>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="exportCSV()" class="bg-emerald-600/20 text-emerald-100 border border-emerald-500/30 px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-600/40 transition">Excel</button>
            <button onclick="exportData()" class="bg-white/10 text-white border border-white/20 px-4 py-2 rounded-xl text-xs font-bold">Backup</button>
            <button onclick="clearAllData()" class="bg-rose-500/80 text-white px-4 py-2 rounded-xl text-xs font-bold">Clear 🗑️</button>
        </div>
    </nav>

    <div class="container mx-auto px-6 pt-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-3 no-print">
            <div class="card sticky top-8">
                <h2 class="text-lg font-bold mb-4 border-b pb-2">📝 New Entry</h2>
                <form onsubmit="addEntry(event)" class="space-y-3">
                    <input type="date" id="date" required>
                    <input type="text" id="orderId" placeholder="Order ID" required>
                    <input type="text" id="asin" placeholder="ASIN" required class="uppercase">
                    <input type="number" step="0.01" id="price" placeholder="Value (Savings)" required>
                    
                    <div class="bg-blue-50/50 p-3 rounded-xl space-y-2 border border-blue-100">
                        <input type="text" id="merchantId" placeholder="Merchant ID" required>
                        <input type="text" id="merchantName" placeholder="Merchant Name" required>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <select id="issue" required>
                            <option value="" disabled selected>Issue...</option>
                            <option value="Fake item">Fake item</option>
                            <option value="Empty box">Empty box</option>
                            <option value="Switch item">Switch item</option>
                            <option value="Broken">Broken</option>
                            <option value="Other">Other</option>
                        </select>
                        <select id="road" required>
                            <option value="" disabled selected>Road...</option>
                            <option value="RTN">RTN</option>
                            <option value="RTO">RTO</option>
                        </select>
                    </div>
                    <select id="action">
                        <option value="Refund">Refund</option>
                        <option value="Replacement">Replacement</option>
                        <option value="Inventory">Return to Inventory</option>
                    </select>
                    <button type="submit" id="saveBtn" class="btn-primary">Save Data</button>
                </form>
            </div>
        </div>

        <div class="lg:col-span-9 space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="card p-4 border-t-4 border-emerald-500"><span class="text-[10px] font-bold text-slate-400">MONTH TOTAL</span><p class="text-xl font-bold" id="monthlyTotal">0</p></div>
                <div class="card p-4 border-t-4 border-purple-500"><span class="text-[10px] font-bold text-slate-400">YEAR TOTAL</span><p class="text-xl font-bold" id="yearlyTotal">0</p></div>
                <div class="card p-4 border-t-4 border-blue-500"><span class="text-[10px] font-bold text-slate-400">ITEMS</span><p class="text-xl font-bold" id="totalItems">0</p></div>
                <div class="card p-4 border-t-4 border-rose-500"><span class="text-[10px] font-bold text-slate-400">REFUND %</span><p class="text-xl font-bold" id="successRate">0%</p></div>
            </div>

            <div class="card">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-lg font-bold">Financial Trends (Monthly)</h3>
                    <div class="bg-slate-100 p-1 rounded-full flex gap-1">
                        <button onclick="switchTimeView('monthly')" id="btn-monthly" class="tab-btn tab-active">Monthly</button>
                        <button onclick="switchTimeView('quarterly')" id="btn-quarterly" class="tab-btn tab-inactive">Quarterly</button>
                    </div>
                </div>
                <div class="h-[250px]"><canvas id="timeChart"></canvas></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="card">
                    <h3 class="font-bold mb-4 text-blue-600">🏢 Top 10 Merchants</h3>
                    <div id="topMerchantGrid" class="space-y-2"></div>
                </div>
                <div class="card">
                    <h3 class="font-bold mb-4 text-amber-600">🏆 Top 10 ASINs</h3>
                    <div id="topAsinGrid" class="space-y-2"></div>
                </div>
            </div>

            <div class="card p-0 overflow-hidden">
                <div class="p-4 border-b flex justify-between items-center">
                    <h3 class="font-bold">Recent History</h3>
                    <input type="text" id="tableSearch" onkeyup="renderTable()" placeholder="Search..." class="w-48 py-1">
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50">
                            <tr><th class="p-3">Date</th><th class="p-3">Info</th><th class="p-3">Merchant</th><th class="p-3 text-right">Value</th><th class="p-3">X</th></tr>
                        </thead>
                        <tbody id="dataTableBody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqkCTgox5u1cQ3xWErHYE-04sqwraWP8o411mlfoG3WPZPN08sNwJJmUtKAjpq_P_NUA/exec"; 
        let entries = JSON.parse(localStorage.getItem('returns_v4') || '[]');
        let charts = {};
        let currentView = 'monthly';
        document.getElementById('date').valueAsDate = new Date();

        function saveData() { localStorage.setItem('returns_v4', JSON.stringify(entries)); }

        async function addEntry(e) {
            e.preventDefault();
            const entry = {
                id: Date.now(),
                date: document.getElementById('date').value,
                orderId: document.getElementById('orderId').value,
                asin: document.getElementById('asin').value.toUpperCase(),
                price: parseFloat(document.getElementById('price').value),
                merchantId: document.getElementById('merchantId').value,
                merchantName: document.getElementById('merchantName').value,
                issue: document.getElementById('issue').value,
                road: document.getElementById('road').value,
                action: document.getElementById('action').value
            };
            entries.push(entry);
            saveData(); updateUI(); e.target.reset();
            document.getElementById('date').valueAsDate = new Date();
            
            if(GOOGLE_SCRIPT_URL.startsWith("http")) {
                fetch(GOOGLE_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(entry) });
            }
        }

        function updateUI() {
            const now = new Date();
            let m=0, y=0, ref=0;
            entries.forEach(e => {
                const ed = new Date(e.date);
                if(ed.getFullYear() === now.getFullYear()) {
                    y += e.price;
                    if(ed.getMonth() === now.getMonth()) m += e.price;
                }
                if(e.action === 'Refund') ref++;
            });

            document.getElementById('monthlyTotal').innerText = m.toLocaleString();
            document.getElementById('yearlyTotal').innerText = y.toLocaleString();
            document.getElementById('totalItems').innerText = entries.length;
            document.getElementById('successRate').innerText = entries.length ? Math.round((ref/entries.length)*100)+'%' : '0%';

            renderTimeChart();
            renderTopList('topMerchantGrid', 'merchantName');
            renderTopList('topAsinGrid', 'asin');
            renderTable();
        }

        function renderTimeChart() {
            const labels = currentView === 'monthly' ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] : ['Q1','Q2','Q3','Q4'];
            const dataArr = Array(labels.length).fill(0);
            const curYear = new Date().getFullYear();

            entries.forEach(e => {
                const ed = new Date(e.date);
                if(ed.getFullYear() === curYear) {
                    const idx = currentView === 'monthly' ? ed.getMonth() : Math.floor(ed.getMonth()/3);
                    dataArr[idx] += e.price;
                }
            });

            if(charts.time) charts.time.destroy();
            charts.time = new Chart(document.getElementById('timeChart'), {
                type: 'line',
                data: { labels, datasets: [{ label: 'Savings', data: dataArr, borderColor: '#10b981', tension: 0.3, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.1)' }] },
                options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        function renderTopList(gridId, key) {
            const stats = {};
            entries.forEach(e => { stats[e[key]] = (stats[e[key]] || 0) + e.price; });
            const sorted = Object.entries(stats).sort((a,b) => b[1]-a[1]).slice(0, 10);
            const grid = document.getElementById(gridId);
            grid.innerHTML = sorted.map(([name, val], i) => `
                <div class="flex justify-between items-center text-xs p-2 bg-slate-50 rounded-lg">
                    <span class="font-bold">#${i+1} ${name}</span>
                    <span class="text-emerald-600 font-bold">${val.toLocaleString()}</span>
                </div>
            `).join('');
        }

        function renderTable() {
            const s = document.getElementById('tableSearch').value.toLowerCase();
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = entries.slice().reverse().filter(e => e.orderId.toLowerCase().includes(s) || e.asin.toLowerCase().includes(s) || e.merchantName.toLowerCase().includes(s))
                .slice(0,20).map(e => `
                <tr>
                    <td class="p-3 text-[10px] text-slate-400">${e.date}</td>
                    <td class="p-3"><div class="font-bold">${e.orderId}</div><div class="text-[9px] text-blue-500">${e.asin}</div></td>
                    <td class="p-3 text-xs">${e.merchantName}</td>
                    <td class="p-3 text-right font-bold text-emerald-600">${e.price.toLocaleString()}</td>
                    <td class="p-3 text-center"><button onclick="deleteEntry(${e.id})" class="text-rose-300">✕</button></td>
                </tr>
            `).join('');
        }

        function switchTimeView(v) {
            currentView = v;
            document.getElementById('btn-monthly').className = v==='monthly' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
            document.getElementById('btn-quarterly').className = v==='quarterly' ? 'tab-btn tab-active' : 'tab-btn tab-inactive';
            renderTimeChart();
        }

        function deleteEntry(id) { if(confirm('Delete?')) { entries = entries.filter(e => e.id !== id); saveData(); updateUI(); } }
        function clearAllData() { if(confirm('Clear ALL?')) { entries = []; saveData(); updateUI(); } }
        function exportCSV() { 
            let csv = "Date,Order,ASIN,Price,Merchant,Issue\n";
            entries.forEach(e => csv += `${e.date},${e.orderId},${e.asin},${e.price},${e.merchantName},${e.issue}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Returns.csv'; a.click();
        }

        updateUI();
    </script>
</body>
</html>
