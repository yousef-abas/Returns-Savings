<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns Master | Intelligence v3</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💎</text></svg>">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Outfit', sans-serif; background-color: #f1f5f9; 
            background-image: radial-gradient(at 0% 0%, hsla(160, 40%, 15%, 1) 0, transparent 50%);
            min-height: 100vh; color: #334155;
        }
        .card { 
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border-radius: 24px; padding: 22px; 
            box-shadow: 0 4px 20px -2px rgba(0,0,0,0.05); border: 1px solid white;
            transition: all 0.3s ease;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.1); }
        
        .alert-card { background: #fff5f5; border: 1px solid #feb2b2; animation: slideIn 0.5s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-20px); } to { opacity: 1; transform: translateX(0); } }

        .stat-value { font-size: 1.7rem; font-weight: 800; color: #0f172a; }
        .tab-btn { padding: 6px 16px; border-radius: 12px; font-weight: 600; font-size: 0.8rem; transition: 0.2s; }
        .tab-active { background: #10b981; color: white; }
        .tab-inactive { color: #64748b; background: #f8fafc; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="pb-12">

    <nav class="w-full pt-6 pb-4 container mx-auto px-6 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-4">
            <div class="w-12 h-12 bg-emerald-500 rounded-2xl flex items-center justify-center text-2xl shadow-lg">💎</div>
            <div>
                <h1 class="text-2xl font-bold text-white tracking-tight">Returns Master Intelligence</h1>
                <p class="text-[10px] text-emerald-200 uppercase font-bold tracking-widest" id="syncStatus">System Online</p>
            </div>
        </div>

        <div class="flex items-center gap-3 bg-white/10 p-2 rounded-2xl backdrop-blur-md">
            <select id="merchantFilter" onchange="updateUI()" class="bg-white text-slate-700 text-xs font-bold py-2 px-4 rounded-xl outline-none border-none shadow-sm min-w-[180px]">
                <option value="all">All Merchants (Global View)</option>
            </select>
            <button onclick="window.location.reload()" class="bg-emerald-500 text-white p-2.5 rounded-xl hover:bg-emerald-400 transition-all shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 4v5h5M20 20v-5h-5M2.047 11.122a10.002 10.002 0 0117.832-5.55M21.953 12.878a10.002 10.002 0 01-17.832 5.55" /></svg>
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-6 mt-4 space-y-6">
        
        <div id="alertSection" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4"></div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="card border-t-4 border-emerald-500"><p class="text-[10px] font-bold text-slate-400 uppercase">Daily Savings</p><p class="stat-value" id="dailyTotal">0</p></div>
            <div class="card border-t-4 border-indigo-500"><p class="text-[10px] font-bold text-slate-400 uppercase">Monthly Recovery</p><p class="stat-value" id="monthlyTotal">0</p></div>
            <div class="card border-t-4 border-amber-500"><p class="text-[10px] font-bold text-slate-400 uppercase">Recovery Rate (%)</p><p class="stat-value" id="healthScore">0%</p></div>
            <div class="card border-t-4 border-rose-500"><p class="text-[10px] font-bold text-slate-400 uppercase">Total Items</p><p class="stat-value" id="totalItems">0</p></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="card lg:col-span-2">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-slate-800">Financial Performance</h3>
                    <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                        <button onclick="switchTimeView('monthly')" id="btn-monthly" class="tab-btn tab-active">Monthly</button>
                        <button onclick="switchTimeView('quarterly')" id="btn-quarterly" class="tab-btn tab-inactive">Quarterly</button>
                    </div>
                </div>
                <div class="h-[300px]"><canvas id="timeChart"></canvas></div>
            </div>
            <div class="card">
                <h3 class="font-bold text-slate-800 mb-6 text-center">ROAD Distribution</h3>
                <div class="h-[300px]"><canvas id="roadChart"></canvas></div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="card flex flex-col items-center"><h3 class="font-bold text-slate-800 mb-4">Root Cause</h3><div class="h-[220px] w-full"><canvas id="issueChart"></canvas></div></div>
            <div class="card flex flex-col items-center"><h3 class="font-bold text-slate-800 mb-4">Action Status</h3><div class="h-[220px] w-full"><canvas id="actionChart"></canvas></div></div>
            <div class="card"><h3 class="font-bold text-slate-800 mb-4">Top ASINs</h3><div id="topAsinGrid" class="space-y-2"></div></div>
        </div>

        <div class="card p-0 overflow-hidden">
            <div class="p-5 border-b flex justify-between items-center">
                <h3 class="font-bold text-slate-800">Comprehensive Logs</h3>
                <input type="text" id="tableSearch" onkeyup="renderTable()" placeholder="Filter results..." class="bg-slate-50 border border-slate-200 text-xs rounded-xl px-4 py-2 w-64 outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead class="bg-slate-50 text-slate-400 font-bold uppercase"><th class="p-4">Date</th><th class="p-4">Order ID / ASIN</th><th class="p-4">Merchant</th><th class="p-4 text-right">Value ($)</th><th class="p-4 text-center">Status</th></thead><tbody id="dataTableBody" class="divide-y divide-slate-100"></tbody></table></div>
        </div>
    </main>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFAht24zvBJ4o0DddZyqFtaBrl3K06_R7bnagwxFM5VhuC70jIZKbxCQuk9UF5-qOU/exec"; 
        let entries = []; let charts = {}; let currentView = 'monthly';

        async function fetchCloudData() {
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const cloudData = await response.json();
                if (cloudData) {
                    entries = cloudData.map(item => ({
                        date: new Date(item.date || item.Date || new Date()).toISOString().split('T')[0],
                        orderId: String(item.orderId || item["Order ID"] || ""),
                        asin: String(item.asin || item.ASIN || "").toUpperCase(),
                        price: parseFloat(item.price || item.Price || 0),
                        merchantId: String(item.merchantId || item["Merchant ID"] || "N/A"),
                        merchantName: String(item.merchantName || item["Merchant Name"] || "N/A"),
                        issue: item.issue || item.Issue || "Unknown",
                        road: item.road || item.Road || "N/A",
                        action: item.action || item.Action || "Pending"
                    }));
                    populateMerchantFilter();
                    updateUI();
                    checkAlerts();
                }
            } catch (e) { console.error(e); }
        }

        function populateMerchantFilter() {
            const select = document.getElementById('merchantFilter');
            const merchants = [...new Set(entries.map(e => e.merchantName))].sort();
            merchants.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.innerText = m;
                select.appendChild(opt);
            });
        }

        function updateUI() {
            const selectedMerchant = document.getElementById('merchantFilter').value;
            const filtered = selectedMerchant === 'all' ? entries : entries.filter(e => e.merchantName === selectedMerchant);
            
            const now = new Date(); const today = now.toISOString().split('T')[0];
            let d=0, m=0, doneValue=0, totalValue=0;
            
            filtered.forEach(e => {
                const ed = new Date(e.date);
                totalValue += e.price;
                if(e.action.toLowerCase() === 'done') doneValue += e.price;
                if(e.date === today) d += e.price;
                if(ed.getFullYear() === now.getFullYear() && ed.getMonth() === now.getMonth()) m += e.price;
            });

            document.getElementById('dailyTotal').innerText = d.toLocaleString();
            document.getElementById('monthlyTotal').innerText = m.toLocaleString();
            document.getElementById('totalItems').innerText = filtered.length.toLocaleString();
            document.getElementById('healthScore').innerText = totalValue > 0 ? ((doneValue/totalValue)*100).toFixed(0) + '%' : '0%';
            
            renderTimeChart(filtered); 
            renderPieCharts(filtered); 
            renderTopAsins(filtered);
            renderTable(filtered);
        }

        function renderTimeChart(data) {
            const labels = currentView === 'monthly' ? ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'] : ['Q1','Q2','Q3','Q4'];
            const dataArr = Array(labels.length).fill(0);
            data.forEach(e => {
                const ed = new Date(e.date);
                if(ed.getFullYear() === 2026) {
                    const idx = currentView === 'monthly' ? ed.getMonth() : Math.floor(ed.getMonth()/3);
                    dataArr[idx] += e.price;
                }
            });
            if(charts.time) charts.time.destroy();
            charts.time = new Chart(document.getElementById('timeChart'), {
                type: 'bar',
                data: { labels, datasets: [{ label: 'Saved Value ($)', data: dataArr, backgroundColor: '#10b981', borderRadius: 8 }] },
                options: { maintainAspectRatio: false }
            });
        }

        function renderPieCharts(data) {
            const gen = (id, key, colors) => {
                const counts = {}; data.forEach(e => counts[e[key]] = (counts[e[key]] || 0) + 1);
                if(charts[id]) charts[id].destroy();
                charts[id] = new Chart(document.getElementById(id), {
                    type: 'doughnut',
                    data: { labels: Object.keys(counts), datasets: [{ data: Object.values(counts), backgroundColor: colors, borderWeight: 0 }] },
                    options: { maintainAspectRatio: false, cutout: '70%', plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 9 } } } } }
                });
            };
            gen('issueChart', 'issue', ['#6366f1', '#ec4899', '#f59e0b', '#10b981']);
            gen('roadChart', 'road', ['#10b981', '#f43f5e']);
            gen('actionChart', 'action', ['#3b82f6', '#8b5cf6', '#10b981']);
        }

        function renderTopAsins(data) {
            const stats = {}; data.forEach(e => stats[e.asin] = (stats[e.asin] || 0) + e.price);
            const sorted = Object.entries(stats).sort((a,b) => b[1]-a[1]).slice(0, 5);
            document.getElementById('topAsinGrid').innerHTML = sorted.map(([name, val]) => `
                <div class="flex justify-between items-center p-3 bg-slate-50 rounded-xl">
                    <span class="text-[10px] font-bold text-slate-600 uppercase">${name}</span>
                    <span class="text-emerald-600 font-bold text-xs">$${val.toLocaleString()}</span>
                </div>`).join('');
        }

        function renderTable(data = entries) {
            const s = document.getElementById('tableSearch').value.toLowerCase();
            const tbody = document.getElementById('dataTableBody');
            const filtered = data.filter(e => e.orderId.toLowerCase().includes(s) || e.asin.toLowerCase().includes(s) || e.merchantName.toLowerCase().includes(s));
            
            tbody.innerHTML = filtered.slice().reverse().slice(0, 15).map(e => `
                <tr class="hover:bg-slate-50 transition-colors">
                    <td class="p-4 font-mono text-[9px] text-slate-400">${e.date}</td>
                    <td class="p-4"><div class="font-bold text-slate-700 text-xs">${e.orderId}</div><div class="text-[9px] text-indigo-500 font-bold">${e.asin}</div></td>
                    <td class="p-4"><div class="text-[10px] font-bold text-slate-600">${e.merchantName}</div></td>
                    <td class="p-4 text-right font-bold text-emerald-600">$${e.price.toLocaleString()}</td>
                    <td class="p-4 text-center"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-lg text-[8px] font-bold uppercase">${e.action}</span></td>
                </tr>`).join('');
        }

        function checkAlerts() {
            const alertBox = document.getElementById('alertSection');
            const counts = {}; entries.forEach(e => counts[e.asin] = (counts[e.asin] || 0) + 1);
            const critical = Object.entries(counts).filter(a => a[1] >= 5);
            if(critical.length > 0) {
                alertBox.classList.remove('hidden');
                alertBox.innerHTML = critical.slice(0, 2).map(([asin, c]) => `
                    <div class="card alert-card flex items-center gap-4">
                        <div class="text-red-500 text-xl">⚠️</div>
                        <div><p class="font-bold text-red-600 text-[10px] uppercase">Action Required</p><p class="text-xs text-slate-700">ASIN <b>${asin}</b> has ${c} returns.</p></div>
                    </div>`).join('');
            }
        }

        function switchTimeView(v) { 
            currentView = v; 
            document.getElementById('btn-monthly').className = v==='monthly'?'tab-btn tab-active':'tab-btn tab-inactive'; 
            document.getElementById('btn-quarterly').className = v==='quarterly'?'tab-btn tab-active':'tab-btn tab-inactive'; 
            updateUI(); 
        }

        window.onload = fetchCloudData;
    </script>
</body>
</html>
