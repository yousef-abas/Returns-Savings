<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Returns Analytics - Private</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        #loginOverlay { position: fixed; inset: 0; background: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        body { font-family: 'Outfit', sans-serif; background: #f8fafc; }
        .card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .hidden-content { display: none; }
    </style>
</head>
<body class="pb-20">

    <div id="loginOverlay">
        <div class="bg-white p-10 rounded-3xl shadow-2xl text-center w-full max-w-sm">
            <h2 class="text-2xl font-bold mb-4">Admin Login 🔒</h2>
            <input type="password" id="passInput" placeholder="Enter Password" class="w-full p-3 border rounded-xl mb-4 text-center outline-emerald-500">
            <button onclick="checkPass()" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold hover:bg-emerald-700 transition">Access Dashboard</button>
            <p id="loginError" class="text-rose-500 mt-2 hidden">Wrong Password!</p>
        </div>
    </div>

    <div id="mainDashboard" class="hidden-content">
        <nav class="bg-slate-900 p-6 text-white mb-8 flex justify-between items-center px-10">
            <h1 class="text-xl font-bold">RETURNS PRO v4</h1>
            <button onclick="location.reload()" class="text-xs bg-white/10 px-3 py-1 rounded">Logout</button>
        </nav>

        <div class="container mx-auto px-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
            <div class="lg:col-span-3">
                <div class="card sticky top-8">
                    <h2 class="font-bold border-b pb-2 mb-4">New Entry</h2>
                    <form onsubmit="addEntry(event)" class="space-y-4">
                        <input type="date" id="date" class="w-full p-2 border rounded-lg" required>
                        <input type="text" id="orderId" placeholder="Order ID" class="w-full p-2 border rounded-lg" required>
                        <input type="text" id="asin" placeholder="ASIN" class="w-full p-2 border rounded-lg" required>
                        <input type="number" step="0.01" id="price" placeholder="Price/Savings" class="w-full p-2 border rounded-lg" required>
                        <select id="issue" class="w-full p-2 border rounded-lg">
                            <option value="Fake item">Fake item</option>
                            <option value="Empty box">Empty box</option>
                            <option value="Switch item">Switch item</option>
                            <option value="Broken">Broken</option>
                            <option value="Missing part">Missing part</option>
                            <option value="Other">Other</option>
                        </select>
                        <select id="road" class="w-full p-2 border rounded-lg">
                            <option value="RTN">RTN</option>
                            <option value="RTO">RTO</option>
                        </select>
                        <button type="submit" id="saveBtn" class="w-full bg-emerald-600 text-white p-3 rounded-xl font-bold shadow-lg shadow-emerald-200">Save Transaction</button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-9 space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-center">
                    <div class="card"><span class="text-xs text-slate-400 font-bold uppercase">Total Savings</span><p class="text-2xl font-bold text-emerald-600" id="mTotal">0</p></div>
                    <div class="card"><span class="text-xs text-slate-400 font-bold uppercase">Items Count</span><p class="text-2xl font-bold" id="iCount">0</p></div>
                    <div class="card"><span class="text-xs text-slate-400 font-bold uppercase">Cloud Sync</span><p id="syncStatus" class="text-xs font-bold text-amber-500">Wait for Sync...</p></div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="card"><h3 class="font-bold mb-4 text-center text-xs uppercase text-slate-400">Issues Distribution</h3><div class="h-64"><canvas id="issueChart"></canvas></div></div>
                    <div class="card"><h3 class="font-bold mb-4 text-center text-xs uppercase text-slate-400">Return Road</h3><div class="h-64"><canvas id="roadChart"></canvas></div></div>
                </div>

                <div class="card overflow-hidden p-0">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 border-b text-[10px] uppercase text-slate-400">
                            <tr><th class="p-4">Date</th><th class="p-4">Order / ASIN</th><th class="p-4 text-right">Value</th><th class="p-4 text-center">X</th></tr>
                        </thead>
                        <tbody id="tableBody" class="divide-y"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- الإعدادات الهامة ---
        const DASHBOARD_PASS = "2066"; // كلمة سر الدخول
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqkCTgox5u1cQ3xWErHYE-04sqwraWP8o411mlfoG3WPZPN08sNwJJmUtKAjpq_P_NUA/exec"; // ضع رابط الـ Web App هنا
        // -----------------------

        let entries = JSON.parse(localStorage.getItem('returns_v4_data') || "[]");
        let charts = {};

        function checkPass() {
            if(document.getElementById('passInput').value === DASHBOARD_PASS) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('mainDashboard').classList.remove('hidden-content');
                updateUI();
            } else {
                document.getElementById('loginError').classList.remove('hidden');
            }
        }

        async function addEntry(e) {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            const data = {
                id: Date.now(),
                date: document.getElementById('date').value,
                orderId: document.getElementById('orderId').value,
                asin: document.getElementById('asin').value.toUpperCase(),
                price: parseFloat(document.getElementById('price').value),
                issue: document.getElementById('issue').value,
                road: document.getElementById('road').value
            };

            // حفظ محلي
            entries.push(data);
            localStorage.setItem('returns_v4_data', JSON.stringify(entries));
            updateUI();
            e.target.reset();
            document.getElementById('date').valueAsDate = new Date();

            // إرسال لجوجل شيت
            if(SCRIPT_URL.includes("google.com")) {
                btn.innerText = "Syncing...";
                try {
                    await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(data) });
                    document.getElementById('syncStatus').innerText = "Synced ✅";
                    document.getElementById('syncStatus').className = "text-xs font-bold text-emerald-500";
                } catch(e) { console.error(e); }
                btn.innerText = "Save Transaction";
            }
        }

        function updateUI() {
            const body = document.getElementById('tableBody');
            body.innerHTML = '';
            let total = 0;

            entries.slice().reverse().forEach(e => {
                total += e.price;
                body.innerHTML += `
                    <tr class="hover:bg-slate-50 transition">
                        <td class="p-4 text-[10px] text-slate-400 font-mono">${e.date}</td>
                        <td class="p-4"><div class="font-bold text-slate-700">${e.orderId}</div><div class="text-[10px] text-indigo-500 font-bold">${e.asin}</div></td>
                        <td class="p-4 text-right font-bold text-emerald-600">+${e.price.toLocaleString()}</td>
                        <td class="p-4 text-center"><button onclick="deleteItem(${e.id})" class="text-rose-300 hover:text-rose-500 text-lg">✕</button></td>
                    </tr>`;
            });

            document.getElementById('mTotal').innerText = total.toLocaleString();
            document.getElementById('iCount').innerText = entries.length;
            renderCharts();
        }

        function renderCharts() {
            const issueCounts = {};
            const roadCounts = {RTN:0, RTO:0};
            entries.forEach(e => {
                issueCounts[e.issue] = (issueCounts[e.issue] || 0) + 1;
                roadCounts[e.road]++;
            });

            if(charts.iss) charts.iss.destroy();
            charts.iss = new Chart(document.getElementById('issueChart'), {
                type: 'pie',
                data: { labels: Object.keys(issueCounts), datasets: [{ data: Object.values(issueCounts), backgroundColor: ['#6366f1','#ec4899','#f59e0b','#10b981','#06b6d4','#ef4444'] }] },
                options: { maintainAspectRatio: false }
            });

            if(charts.rod) charts.rod.destroy();
            charts.rod = new Chart(document.getElementById('roadChart'), {
                type: 'pie',
                data: { labels: Object.keys(roadCounts), datasets: [{ data: Object.values(roadCounts), backgroundColor: ['#10b981','#f43f5e'] }] },
                options: { maintainAspectRatio: false }
            });
        }

        function deleteItem(id) {
            if(confirm('Delete permanently?')) {
                entries = entries.filter(e => e.id !== id);
                localStorage.setItem('returns_v4_data', JSON.stringify(entries));
                updateUI();
            }
        }
        document.getElementById('date').valueAsDate = new Date();
    </script>
</body>
</html>
